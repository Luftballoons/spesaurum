<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SPES AURUM - Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-bar">
  <h1>SPES AURUM</h1>
  <div class="top-right-container">
    <span id="top-right">Not logged in</span>
    <div id="auth-buttons"></div>
  </div>
</header>

<section class="contact-section">
  <h2>Contact Us</h2>

  <!-- WhatsApp Box -->
  <div class="contact-box">
    <h3>Reach Us on WhatsApp</h3>
    <p>Have questions or need help? Message us directly.</p>

    <a href="https://wa.me/60123456789" target="_blank" class="view-btn">
      Message on WhatsApp
    </a>
  </div>

  <!-- Staff Cards -->
  <div class="staff-grid">

    <div class="staff-card">
      <img src="staff1.jpg" alt="Staff">
      <h3>John Doe</h3>
      <p>Founder</p>
    </div>

    <div class="staff-card">
      <img src="staff2.jpg" alt="Staff">
      <h3>Jane Smith</h3>
      <p>Developer</p>
    </div>

    <div class="staff-card">
      <img src="staff3.jpg" alt="Staff">
      <h3>Alex Tan</h3>
      <p>Moderator</p>
    </div>

  </div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
